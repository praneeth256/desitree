<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c842;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c99a20;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Gold rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#goldGrad)" />
  <!-- Inner subtle border for depth -->
  <rect x="3" y="3" width="58" height="58" rx="11" ry="11" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- DT text in dark navy/indigo -->
  <text
    x="32"
    y="45"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-weight="800"
    font-size="28"
    fill="#1a1040"
    letter-spacing="-1"
  >DT</text>
</svg>
